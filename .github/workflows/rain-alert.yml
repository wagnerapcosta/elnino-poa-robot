name: Radar POA - Alerta chuva 12h

on:
  push:
    branches: [main]
    paths:
      - robot.py
      - rain_alert.py
      - official_data.py
      - operational_notices.py
      - notification_state.py
      - airport_focus.py
      - mobile_layout.py
      - config/airport_focus.json
      - tests/**
      - .github/scripts/rain_alert_coverage.py
      - .github/workflows/rain-alert.yml
  schedule:
    # Três oportunidades por hora. O GitHub pode atrasar ou omitir disparos.
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: radar-poa-production
  queue: max
  cancel-in-progress: false

jobs:
  rain-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_MODE: rain_alert
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verificar se a hora ja foi consultada
        id: coverage
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/rain_alert_coverage.py
      - uses: actions/setup-python@v5
        if: steps.coverage.outputs.covered != 'true'
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        if: steps.coverage.outputs.covered != 'true'
      - run: python -m unittest discover -s tests -v
        if: steps.coverage.outputs.covered != 'true'
      - name: Consultar previsao e avaliar alertas
        if: steps.coverage.outputs.covered != 'true'
        run: python robot.py
      - name: Persistir memoria de notificacoes e historico
        if: always() && steps.coverage.outputs.covered != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -f data/notification_state.json ]; then git add data/notification_state.json; fi
          if [ -f data/history.csv ]; then git add data/history.csv; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza memoria de notificacoes e historico"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.coverage.outputs.covered != 'true'
        with:
          name: chuva-12h-${{ github.run_id }}
          path: reports/rain_alert/
          if-no-files-found: ignore
