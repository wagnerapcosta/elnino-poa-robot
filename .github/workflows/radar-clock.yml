name: Radar SBPA - Temporizador de reserva

on:
  push:
    branches: [main]
    paths: [.github/workflows/radar-clock.yml]
  schedule:
    # Reinicia o ciclo se um disparo interno falhar.
    - cron: '53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: radar-sbpa-clock
  cancel-in-progress: false

jobs:
  tick:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: radar-sbpa-clock
      deployment: false
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirmar espera do temporizador
        id: timer
        run: |
          read_github_value() {
            local delay result
            for delay in 0 2 5; do
              sleep "$delay"
              if result=$(gh api "$@"); then
                printf '%s\n' "$result"
                return 0
              fi
            done
            return 1
          }

          timer=$(read_github_value "repos/$GITHUB_REPOSITORY/environments/radar-sbpa-clock" \
            --jq '.protection_rules[] | select(.type == "wait_timer") | .wait_timer')
          created=$(read_github_value "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          if [[ "$timer" != 40 || "$elapsed" -lt 2340 ]]; then
            echo 'Temporizador de 40 minutos ausente ou espera não observada. Ciclo interrompido.'
            exit 1
          fi
          echo "Temporizador de 40 minutos confirmado; execução criada há $elapsed segundos."
      - name: Acionar consulta de reserva
        run: |
          printf '%s\n' '{"ref":"main","inputs":{"hourly_fallback":true}}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/rain-alert.yml/dispatches" --input -
      - name: Preparar o proximo ciclo
        if: ${{ !cancelled() && steps.timer.outcome == 'success' }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/radar-clock.yml/dispatches" -f ref=main
      - name: Acionar boletim ENOS de reserva
        if: ${{ !cancelled() && steps.timer.outcome == 'success' }}
        run: |
          # Preserve the daily 15:41 UTC schedule and only cover a missing or failed production run.
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          due="${now%%T*}T15:41:00Z"
          if [[ "$now" < "$due" ]]; then
            echo 'A janela diária do ENOS ainda não abriu.'
            exit 0
          fi

          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/enso-alert.yml"
          covered=$(gh api --method GET "$endpoint/runs" -f branch=main -f "created=>=$due" \
            --jq '[.workflow_runs[] | select(.display_title == "ENOS | produção" and (.status != "completed" or .conclusion == "success"))] | length')
          if [[ "$covered" != 0 ]]; then
            echo 'Já existe execução ENOS de produção concluída com sucesso ou em andamento hoje.'
            exit 0
          fi

          printf '%s\n' '{"ref":"main","inputs":{"preview":false}}' | \
            gh api --method POST "$endpoint/dispatches" --input -
