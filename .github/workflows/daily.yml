name: Radar El Nino POA - Tactical Daily

on:
  schedule:
    # 09:30 UTC = 06:30 Brasilia
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-poa-production
  queue: max
  cancel-in-progress: false

jobs:
  run-daily-radar:
    runs-on: ubuntu-latest

    env:
      RUN_MODE: daily
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar radar diario
        run: python robot.py

      - name: Salvar relatorios e graficos como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-diario-poa
          path: |
            reports/
            data/

      - name: Persistir memoria de notificacoes e historico
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -f data/notification_state.json ]; then git add data/notification_state.json; fi
          if [ -f data/history.csv ]; then git add data/history.csv; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza memoria de notificacoes e historico"
          git pull --rebase origin main
          git push origin HEAD:main
