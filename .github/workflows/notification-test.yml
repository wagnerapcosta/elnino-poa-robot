name: Radar POA - TESTE de notificacao

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Cenario explicito de teste (envios usam dados simulados)
        type: choice
        default: offline
        options:
          - offline
          - pacote
          - essencial
          - chuva-20mm
          - falha-e-municipal
          - falha-repetida-recuperacao

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Executar somente o cenario solicitado
        env:
          TEST_SCENARIO: ${{ inputs.scenario }}
        run: |
          case "$TEST_SCENARIO" in
            offline) python notification_patch_test.py --dry-run ;;
            pacote) python notification_patch_test.py ;;
            essencial) python notification_essential_test.py ;;
            chuva-20mm) python notification_test.py ;;
            falha-e-municipal) python notification_test.py --operational ;;
            falha-repetida-recuperacao) python notification_test.py --dedup-recovery ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-test-${{ github.run_id }}
          path: reports/notification*test.json
          if-no-files-found: ignore
