name: Radar POA - TESTE de notificacao

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/notification-test.yml

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Reenviar apenas os dois testes faltantes com intervalo
        run: python notification_missing_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-missing-test-${{ github.run_id }}
          path: reports/notification_missing_test.json
          if-no-files-found: ignore
