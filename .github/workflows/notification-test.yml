name: Radar POA - TESTE de notificacao

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/notification-test.yml

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Enviar dois testes - falha principal e Defesa Civil POA
        run: python notification_test.py --operational
